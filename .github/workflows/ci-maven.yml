name: CI - Tests automatisés

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: junit-jupiter-starter-maven

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Exécution des tests avec Maven
        run: mvn -B test

      - name: Génération du rapport de couverture
        run: mvn -B jacoco:report

      - name: Upload du rapport de tests
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: junit-jupiter-starter-maven/target/surefire-reports/

      - name: Upload du rapport JaCoCo
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: junit-jupiter-starter-maven/target/site/jacoco/

